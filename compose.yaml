services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in your .env}
      HOST: 0.0.0.0
    volumes:
      - planner-data:/app/data
      - planner-backups:/app/backups
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in your .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  planner-data:
  planner-backups:
  caddy-data:
  caddy-config:

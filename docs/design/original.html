<script>
"use strict";

/* =========================
   Exact recurring source data
========================= */
const WEEKDAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const PLAN_GROUPS=[
 {id:"Weekdays",label:"Mon–Fri",detail:"One shared plan for every weekday"},
 {id:"Weekend",label:"Sat–Sun",detail:"One shared plan for every Saturday and Sunday"}

const WORKWEEK_PLAN=[

 "Free time - Sleep / GYM / Swim / Play until 19.00","Eat until 19.30",

const WEEKEND_PLAN=[

 "Eat until 9.00","Full Mock until Launch","Eat until 14.00",
 "Analyze Mock until 17.00","Movie until 18.00",
 "Free time - Sleep / GYM / Swim / Play until 19.00","Eat until 19.30",

];
const STUDY_PRESETS={
 Weekdays:{"Math Olympiads until 10.30":120,"Reading (1 passage + Analyze) 1.5h":90,"Listening (Full Mock + Analyze) 1.15h":75,"Vocab review 0.15h":15,"Writing 1.5h":90,"Speaking 1h":60,"New Vocab 0.5h":30},
 Weekend:{"Full Mock until Launch":240,"Eat until 14.00":60,"Analyze Mock until 17.00":180,"Movie until 18.00":60}

const STUDY_HIGHLIGHTS={

 Weekend:new Set(["Full Mock until Launch","Analyze Mock until 17.00"])

const SCHEDULE={
Monday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Swim until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]],
Tuesday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Do everything you want until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]],
Wednesday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["GYM until 19.00",""],
["Eat until 20.00",""],["Startup until 22.00 2h",""],["Sleep until 22.30",""]],
Thursday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Do everything you want until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]],
Friday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Free time until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]],
Saturday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Swimming until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]],
Sunday:[
["Get up at 6.00",""],["Sport until 7.00",""],["Self - Care until 8.00",""],["Eat until 8.30",""],
["SAT English until 10.00 2h",""],["SAT Math until 13.00 2.5h",""],["Eat until 13.30",""],
["SAT Vocab + Review until 15.00 1.5h",""],["Math Olympiads until 17.00 2h",""],["Free time until 19.00",""],
["Eat until 19.30",""],["Startup until 22.00 2.5h",""],["Sleep until 22.30",""]]
};

/* =========================
   State / storage
========================= */
const KEYS={
templates:"planner_recurring_templates", completions:"planner_task_completions",
custom:"planner_custom_tasks", pom:"planner_pomodoro_settings", stats:"planner_pomodoro_stats", exams:"planner_exam_dates",
prefs:"planner_preferences", activePom:"planner_active_pomodoro", activeStudy:"planner_active_study_flow"
};
const defaults={
pom:{
 blocks:[
  {work:25,rest:5,repeats:5},
  {work:50,rest:10,repeats:1},
  {work:25,rest:5,repeats:2}
 ],loop:true,sound:true,notifications:false,selectedTask:"",brownNoise:true,brownVolume:35
},stats:{today:{date:"",sessions:0,minutes:0,blocks:0},totalSessions:0,totalMinutes:0,totalBlocks:0,streak:0,lastFocusDate:""},
prefs:{sound:true,notifications:false,loop:true}
};
let state={templates:null,completions:{},custom:{},pom:null,stats:null,prefs:null,exams:[]};
let selectedDate=new Date(); selectedDate.setHours(12,0,0,0);
let page="today", manageDay="Weekdays", focusTimer=null;
let studyTimer=null,studyInterval=null,studyAudio=null;
let skipUnloadSave=false;
const PLAN_START_DATE="2026-09-30", TABLE_DAYS=30;
let tablePage=0;
let tableGroup="Weekdays";
let menuOpen=false;
let renderedDay=dateKey(new Date());

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadJSON(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):clone(f)}catch{return clone(f)}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast("Could not save data in this browser.");return false}}
function init(){
 state.templates=loadJSON(KEYS.templates,null);
 if(!state.templates){state.templates={};WEEKDAYS.forEach(d=>state.templates[d]=SCHEDULE[d].map((x,i)=>({id:"t_"+d+"_"+i+"_"+Math.random().toString(36).slice(2),name:x[0],schedule:"",notes:""})));saveJSON(KEYS.templates,state.templates)}
 state.completions=loadJSON(KEYS.completions,{});
 ensurePlanGroups();
 state.custom=loadJSON(KEYS.custom,{});
 state.pom=loadJSON(KEYS.pom,defaults.pom);
 state.stats=loadJSON(KEYS.stats,defaults.stats);
 state.prefs=loadJSON(KEYS.prefs,{sound:true,notifications:false,loop:true});
 state.exams=loadJSON(KEYS.exams,[]);
 if(!Array.isArray(state.exams))state.exams=[];
 seedExamDates();
 upgradeWorkweekPlan();
 upgradeWeekendPlan();
 ensureStudyCategories();
 ensureStudyFlow();
 tableGroup=PLAN_GROUPS.some(g=>g.id===state.prefs.tableGroup)?state.prefs.tableGroup:"Weekdays";
 state.pom.sound=state.prefs.sound; state.pom.loop=state.prefs.loop;
 state.pom.brownNoise = state.pom.brownNoise !== false;
 state.pom.brownVolume = Number.isFinite(+state.pom.brownVolume) ? Math.max(0,Math.min(100,+state.pom.brownVolume)) : 35;
 ensureTodayStats();
 restoreActiveTimers();
 render();
 syncBrownNoise();
}
function ensurePlanGroups(){
 if(!state.templates||typeof state.templates!=="object")state.templates={};
 let changed=false;
 for(const day of ["Saturday","Sunday"]){
  if(!Array.isArray(state.templates[day])){state.templates[day]=SCHEDULE[day].map((x,i)=>({id:`t_${day}_${i}_${Math.random().toString(36).slice(2)}`,name:x[0],schedule:"",notes:""}));changed=true}
 }
 if(!Array.isArray(state.templates.Weekdays)){
  const next=WORKWEEK_PLAN.map((name,i)=>({id:`t_Weekdays_${i}_${Math.random().toString(36).slice(2)}`,name,schedule:"",notes:""}));
  // Match only identical old task names, so completed work remains visible after migration.
  for(const [key,checks] of Object.entries(state.completions||{})){
   const day=weekday(fromKey(key));
   if(day==="Saturday"||day==="Sunday"||!checks||typeof checks!=="object")continue;
   const old=state.templates[day]||[],used=new Set();
   for(const task of next){
    const match=old.find((item,i)=>item.name===task.name&&checks[item.id]&&!used.has(i));
    if(match){checks[task.id]=true;used.add(old.indexOf(match))}
   }
  }
  state.templates.Weekdays=next;changed=true;
  saveJSON(KEYS.completions,state.completions);
 }
 if(changed)saveJSON(KEYS.templates,state.templates);
}
function upgradeWorkweekPlan(){
 if(state.prefs.workweekVersion===2)return;
 const previous=state.templates.Weekdays||[],used=new Set();
 state.templates.Weekdays=WORKWEEK_PLAN.map((name,i)=>{
  const matchIndex=previous.findIndex((task,index)=>!used.has(index)&&task.name.trim()===name);
  if(matchIndex>=0){used.add(matchIndex);return previous[matchIndex]}
  return {id:`t_Weekdays_v2_${i}_${Math.random().toString(36).slice(2)}`,name,schedule:"",notes:""};
 });
 state.prefs.workweekVersion=2;
 saveJSON(KEYS.templates,state.templates);
 saveJSON(KEYS.prefs,state.prefs);
}
function upgradeWeekendPlan(){
 if(state.prefs.weekendVersion===1 && Array.isArray(state.templates.Weekend))return;
 const previous=Array.isArray(state.templates.Weekend)?state.templates.Weekend:[],used=new Set();
 const next=WEEKEND_PLAN.map((name,i)=>{
  const matchIndex=previous.findIndex((task,index)=>!used.has(index)&&task.name.trim()===name);
  if(matchIndex>=0){used.add(matchIndex);return previous[matchIndex]}
  return {id:`t_Weekend_${i}_${Math.random().toString(36).slice(2)}`,name,schedule:"",notes:""};
 });
 for(const [key,checks] of Object.entries(state.completions||{})){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||!checks||typeof checks!=="object")continue;
  const day=weekday(fromKey(key));
  if(day!=="Saturday"&&day!=="Sunday")continue;
  const old=state.templates[day]||[],matched=new Set();
  for(const task of next){
   if(checks[task.id])continue;
   const matchIndex=old.findIndex((item,i)=>!matched.has(i)&&item.name===task.name&&checks[item.id]);
   if(matchIndex>=0){checks[task.id]=true;matched.add(matchIndex)}
  }
 }
 state.templates.Weekend=next;
 state.prefs.weekendVersion=1;
 saveJSON(KEYS.templates,state.templates);
 saveJSON(KEYS.completions,state.completions);
 saveJSON(KEYS.prefs,state.prefs);
}
function ensureStudyFlow(){
 if(!state.prefs.studyFlow||typeof state.prefs.studyFlow!=="object")state.prefs.studyFlow={};
 let changed=false;
 for(const group of PLAN_GROUPS){
  const settings=state.prefs.studyFlow[group.id] ||= {};
  for(const task of state.templates[group.id]||[]){
   if(settings[task.id])continue;
   const minutes=STUDY_PRESETS[group.id]?.[task.name];
   if(minutes){settings[task.id]={enabled:true,minutes};changed=true}
  }
 }
 if(changed)saveJSON(KEYS.prefs,state.prefs);
}
function ensureStudyCategories(){
 let changed=false;
 for(const group of PLAN_GROUPS)for(const task of state.templates[group.id]||[]){
  if(task.study===undefined&&STUDY_HIGHLIGHTS[group.id]?.has(task.name)){task.study=true;changed=true}
 }
 if(changed)saveJSON(KEYS.templates,state.templates);
}
function studySetting(group,task){return state.prefs.studyFlow?.[group]?.[task.id]||{enabled:false,minutes:25}}
function studyItemsForToday(){
 const group=planGroup(new Date());
 return (state.templates[group]||[]).filter(t=>studySetting(group,t).enabled).map(t=>{
  const minutes=Math.max(1,Math.min(600,Number(studySetting(group,t).minutes)||25));
  const restMinutes=t.study===true?Math.min(minutes-1,minutes<=30?5:10):0;
  return {id:t.id,name:t.name,minutes,restMinutes,workMinutes:minutes-restMinutes};
 });
}
function ensureTodayStats(){
 const k=dateKey(new Date());
 if(state.stats.today.date!==k) state.stats.today={date:k,sessions:0,minutes:0,blocks:0};
}
function dateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function fromKey(k){const [y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d);x.setHours(12,0,0,0);return x}
function weekday(d){return WEEKDAYS[(d.getDay()+6)%7]}
function planGroup(d){const day=weekday(d);return day==="Saturday"||day==="Sunday"?"Weekend":"Weekdays"}
function groupLabel(group){return PLAN_GROUPS.find(x=>x.id===group)?.label||group}
function fmtDate(d){return d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}
function shortDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function validExamDate(key){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return false;
 const [year,month,day]=key.split("-").map(Number),d=new Date(Date.UTC(year,month-1,day));
 return d.getUTCFullYear()===year&&d.getUTCMonth()===month-1&&d.getUTCDate()===day;
}
function examDaysLeft(key,now=new Date()){
 if(!validExamDate(key))return NaN;
 const [y,m,d]=key.split("-").map(Number);
 return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
}
function sortedExams(){return state.exams.filter(x=>x&&typeof x.name==="string"&&validExamDate(x.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name))}
function nextExam(){return sortedExams().find(x=>examDaysLeft(x.date)>=0)||null}
function examDateLabel(key){return fromKey(key).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
function examCountdownLabel(days){return days===0?"Today":days===1?"1 day left":days>1?`${days} days left`:`${Math.abs(days)} ${days===-1?"day":"days"} ago`}
function seedExamDates(){
 if(state.prefs.examSeedVersion===1)return;
 const seeded=[
  {name:"Math Olympiad",date:"2026-10-14"},
  {name:"English Olympiad",date:"2026-10-22"},
  {name:"AMC 10A",date:"2026-11-05"}
 ];
 for(const exam of seeded){
  if(!state.exams.some(x=>x?.date===exam.date&&String(x.name||"").toLowerCase()===exam.name.toLowerCase()))
   state.exams.push({id:`exam_${Date.now()}_${Math.random().toString(36).slice(2)}`,name:exam.name,date:exam.date,notes:""});
 }
 state.prefs.examSeedVersion=1;
 saveJSON(KEYS.exams,state.exams);
 saveJSON(KEYS.prefs,state.prefs);
}
function tasksFor(d){return state.templates[planGroup(d)]||[]}
function compFor(k){return state.completions[k]||(state.completions[k]={})}
function metrics(d){const ts=tasksFor(d), c=compFor(dateKey(d));let done=ts.filter(t=>c[t.id]).length,total=ts.length;let pct=total?done/total*100:0;return{done,total,pct,status:pct>=90?"Excellent":pct>=75?"Very Good":pct>=60?"Good":pct>=40?"Average":"Low Progress"}}
function persist(){saveJSON(KEYS.templates,state.templates);saveJSON(KEYS.completions,state.completions);saveJSON(KEYS.custom,state.custom);saveJSON(KEYS.pom,state.pom);saveJSON(KEYS.stats,state.stats);saveJSON(KEYS.prefs,state.prefs);saveJSON(KEYS.exams,state.exams)}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2200)}
function navigate(delta){if(page==="table")tablePage=Math.max(0,tablePage+delta);else selectedDate.setDate(selectedDate.getDate()+delta);render()}
function goToday(){selectedDate=new Date();selectedDate.setHours(12,0,0,0);page="today";render()}
function setPage(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}

/* =========================
   Rendering
========================= */
const navItems=[["today","Today"],["weekly","Weekly"],["table","Plan Table"],["exams","Exam Dates"],["all","All Days"],["manage","Manage Plans"],["pomodoro","Pomodoro"],["settings","Settings"]];
function renderNav(){
 const side=document.getElementById("sideNav");
 side.innerHTML=navItems.map(([id,label])=>`<button class="${page===id?"active":""}" data-page="${id}">${label}</button>`).join("");
 document.getElementById("mobileNav").innerHTML=navItems.slice(0,4).map(([id,label])=>`<button class="${page===id?"active":""}" data-page="${id}">${label}</button>`).join("");
}
function render(){
 ensureTodayStats();renderNav();
 renderExamQuick();
 document.body.classList.toggle("table-view",page==="table");
 document.getElementById("prevBtn").setAttribute("aria-label",page==="table"?"Previous period":"Previous day");
 document.getElementById("nextBtn").setAttribute("aria-label",page==="table"?"Next period":"Next day");
 const p=document.getElementById("appPage");
 p.style.paddingBottom="";
 p.classList.toggle("sheet-page",page==="table");
 if(page==="today")p.innerHTML=renderDaily(dateKey(selectedDate)===dateKey(new Date()));
 else if(page==="weekly")p.innerHTML=renderWeekly();
 else if(page==="table")p.innerHTML=renderTable();
 else if(page==="exams")p.innerHTML=renderExams();
 else if(page==="all")p.innerHTML=renderAll();
 else if(page==="manage")p.innerHTML=renderManage();
 else if(page==="pomodoro")p.innerHTML=renderPom();
 else p.innerHTML=renderSettings();
 bindPage();
 renderStudyWidget();
 if(page==="table")requestAnimationFrame(()=>window.scrollTo(0,0));
}
function renderDaily(isToday){
 const d=selectedDate,m=metrics(d),k=dateKey(d),wd=weekday(d),ts=tasksFor(d),c=compFor(k);
 const tasks=ts.length?`<div class="task-list">${ts.map((t,i)=>taskHTML(t,c[t.id],i)).join("")}</div>`:`<div class="empty"><b>TODAY'S PLAN</b>No plans scheduled.<br><button class="btn black" data-action="add" style="margin-top:14px">+ Add Plan</button></div>`;
 return `<div class="hero"><div><div class="eyebrow">${wd} · ${groupLabel(planGroup(d))}</div><div class="title">${fmtDate(d)}</div><div class="subtitle">${isToday?"TODAY'S PLAN":"DAILY PLAN"}${k>dateKey(new Date())?" · Future completion is locked":""}</div></div><div class="hero-actions"><button class="btn" data-focus-select>Focus on task</button><button class="btn black" data-action="pom">Start Pomodoro</button></div></div>
 <div class="overview"><div class="panel progress-panel"><div class="progress-top"><div><div class="bigpct">${m.pct.toFixed(1)}%</div><div class="status">${m.status}</div></div><div class="count">${m.done} / ${m.total} completed</div></div><div class="bar"><i style="width:${m.pct}%"></i></div></div>
 <div class="panel focus-mini"><div class="focus-meta">FOCUS</div><div class="timer" id="miniTimer">${timerDisplay()}</div><button class="btn black" data-action="pomStart">${focusTimer&&focusTimer.running?"PAUSE":"START"}</button></div></div>
 ${renderExamPreview()}<div class="section-head"><h2>${isToday?"TODAY'S PLAN":"PLAN"}</h2><button class="btn" data-action="add">+ Add Plan</button></div>${tasks}`;
}
function renderExamQuick(){
 const quick=document.getElementById("quickExam"),exam=nextExam();
 quick.classList.toggle("active",page==="exams");
 quick.innerHTML=exam?`<span class="exam-quick-dot"></span><span class="exam-quick-name">${esc(exam.name)}</span><strong>${examDaysLeft(exam.date)===0?"Today":`${examDaysLeft(exam.date)}d`}</strong>`:`<span class="exam-quick-dot"></span><span>Add exam date</span>`;
 quick.title=exam?`${exam.name} - ${examDateLabel(exam.date)} (${examCountdownLabel(examDaysLeft(exam.date))})`:"Add an exam date";
}

 const exam=nextExam();

function renderTable(){
 const group=PLAN_GROUPS.find(g=>g.id===tableGroup)||PLAN_GROUPS[0];
 // Keep only yesterday as the carryover day; this also shows the previous
 // month's final date when the calendar rolls over.
 const yesterday=new Date();yesterday.setHours(12,0,0,0);yesterday.setDate(yesterday.getDate()-1);
 const cursor=fromKey(dateKey(yesterday)<PLAN_START_DATE?PLAN_START_DATE:dateKey(yesterday));
 const filtered=[];let skip=tablePage*TABLE_DAYS;
 while(filtered.length<TABLE_DAYS){
  if(planGroup(cursor)===group.id){if(skip)skip--;else filtered.push(new Date(cursor))}
  cursor.setDate(cursor.getDate()+1);
 }
 const start=filtered[0],end=filtered[filtered.length-1];
 const title=start.getFullYear()===end.getFullYear()?`${start.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${shortDate(end)}`:`${shortDate(start)} – ${shortDate(end)}`;
 return `<div class="sheet-intro"><div><div class="sheet-kicker">PLAN TABLE / ${esc(group.label.toUpperCase())}</div><h1>${esc(group.label)} schedule <span>30 days</span></h1></div><button class="btn black sheet-edit" data-edit-group="${group.id}">Edit plan</button></div><div class="sheet-controls"><div class="sheet-groups" role="group" aria-label="Choose plan group">${PLAN_GROUPS.map(g=>`<button type="button" class="${g.id===group.id?"active":""}" data-table-group="${g.id}" aria-pressed="${g.id===group.id}">${g.label}</button>`).join("")}</div><div class="sheet-actions"><button class="btn" data-table-page="-1" aria-label="Previous period" ${tablePage===0?"disabled":""}>←</button><span class="sheet-month">${esc(title)}</span><button class="btn" data-table-page="1" aria-label="Next period">→</button><button class="btn" data-table-start>Upcoming</button></div></div>${renderPlanTable(group,filtered)}`;
}

function sequenceFlat(){
 const out=[];state.pom.blocks.forEach((b,bi)=>{
  const work=Math.max(1,Math.min(600,Number(b.work)||25))*60,rest=Math.max(0,Math.min(600,Number(b.rest)||0))*60,repeats=Math.max(1,Math.min(100,Number(b.repeats)||1));
  for(let r=0;r<repeats;r++)out.push({work,rest,block:out.length+1,group:bi+1,repeat:r+1});
 });return out;
}
function saveActiveTimers(){saveJSON(KEYS.activePom,focusTimer);saveJSON(KEYS.activeStudy,studyTimer)}
function restoreActiveTimers(){
 const pom=loadJSON(KEYS.activePom,null);
 if(pom&&Array.isArray(pom.sequence)&&pom.sequence.length&&pom.sequence.length<=10000&&pom.sequence.every(x=>Number.isFinite(x.work)&&x.work>0&&Number.isFinite(x.rest)&&x.rest>=0)&&Number.isInteger(pom.index)&&pom.index>=0&&pom.index<pom.sequence.length&&["work","rest"].includes(pom.mode)){
  focusTimer=pom;
  if(focusTimer.running){syncPom(Date.now(),true);if(focusTimer.running){clearInterval(startPom.iv);startPom.iv=setInterval(tick,200)}}
 }
 const study=loadJSON(KEYS.activeStudy,null);
 if(study&&Array.isArray(study.items)&&study.items.length&&study.items.length<=1000&&study.items.every(x=>typeof x.name==="string"&&Number.isFinite(x.minutes)&&x.minutes>0&&Number.isFinite(x.workMinutes)&&x.workMinutes>0&&Number.isFinite(x.restMinutes)&&x.restMinutes>=0&&x.workMinutes+x.restMinutes===x.minutes)&&Number.isInteger(study.index)&&study.index>=0&&study.index<study.items.length&&["work","rest"].includes(study.phase)){
  studyTimer=study;
  if(studyTimer.running){tickStudy(true);if(studyTimer.running){clearInterval(studyInterval);studyInterval=setInterval(tickStudy,250)}}
 }

function startPom(){
 if(focusTimer?.running){syncPom();syncBrownNoise();return;}
 const seq=sequenceFlat();if(!seq.length){toast("Add a Pomodoro block first.");return}
 if(!focusTimer||focusTimer.finished){focusTimer={sequence:seq,index:0,mode:"work",remaining:seq[0].work*1000,endAt:Date.now()+seq[0].work*1000,running:true,paused:false,finished:false,totalBlocks:seq.length,block:1}}
 else{focusTimer.running=true;focusTimer.paused=false;focusTimer.endAt=Date.now()+Math.max(0,focusTimer.remaining)}
 saveActiveTimers();
 clearInterval(startPom.iv);startPom.iv=setInterval(tick,200);

function tick(){
 if(!focusTimer||!focusTimer.running)return;
 if(!syncPom())updateTimerDOM();
}
function advanceWork(deadline){
 const seq=focusTimer.sequence;
 focusTimer.index++;
 if(focusTimer.index>=seq.length){
   if(state.pom.loop)focusTimer.index=0;
   else{focusTimer.running=false;focusTimer.paused=false;focusTimer.finished=true;focusTimer.remaining=0;focusTimer.endAt=null;clearInterval(startPom.iv);return}
 }
 focusTimer.mode="work";focusTimer.block=focusTimer.index+1;focusTimer.endAt=deadline+seq[focusTimer.index].work*1000;
}
function syncPom(now=Date.now(),silent=false){
 if(!focusTimer?.running)return false;
 const seq=focusTimer.sequence;
 if(!Number.isFinite(focusTimer.endAt))focusTimer.endAt=now+Math.max(0,focusTimer.remaining||0);
 let changed=false,message="";
 const cycle=seq.reduce((total,x)=>total+(x.work+x.rest)*1000,0);
 if(state.pom.loop&&cycle>0&&now-focusTimer.endAt>=cycle){focusTimer.endAt+=Math.floor((now-focusTimer.endAt)/cycle)*cycle;changed=true}
 let guard=seq.length*2+3;
 while(focusTimer.running&&focusTimer.endAt<=now&&guard-->0){
  const deadline=focusTimer.endAt,cur=seq[focusTimer.index];
  if(focusTimer.mode==="work"){
   if(!silent)recordFocus(cur.work/60);
   if(cur.rest>0){focusTimer.mode="rest";focusTimer.endAt=deadline+cur.rest*1000;message="Work session completed - Rest begins."}
   else{advanceWork(deadline);message=focusTimer.running?"Work session completed - Next work session begins.":"Pomodoro sequence complete."}
  }else{advanceWork(deadline);message=focusTimer.running?"Rest completed - Work session begins.":"Pomodoro sequence complete."}
  changed=true;
 }
 focusTimer.remaining=focusTimer.running?Math.max(0,focusTimer.endAt-now):0;
 if(changed){
  saveActiveTimers();
  if(!silent){destroyBrownNoise();sound();if(message)notify(message);if(focusTimer.finished)toast(message);render();syncBrownNoise()}
 }
 return changed;
}
function pausePom(){

function studyChime(){

   const at=studyAudio.currentTime+i*.19,o=studyAudio.createOscillator(),g=studyAudio.createGain();

function bindPlanDrag(row){

  active.target=null;

   const scroll=()=>{
    if(!active?.dragging)return;
    const edge=65,delta=active.y<edge?-Math.min(15,(edge-active.y)/4):active.y>innerHeight-edge?Math.min(15,(active.y-innerHeight+edge)/4):0;
    if(delta){window.scrollBy(0,delta);markTarget()}
    active.frame=requestAnimationFrame(scroll);
   };
   active.frame=requestAnimationFrame(scroll);
  }
 };

  if(!active||e.pointerId!==active.id)return;

 if(key==="sound"){state.prefs.sound=!state.prefs.sound;state.pom.sound=state.prefs.sound}
 if(key==="loop"){state.prefs.loop=!state.prefs.loop;state.pom.loop=state.prefs.loop}
 if(key==="notifications"){state.prefs.notifications=!state.prefs.notifications;state.pom.notifications=state.prefs.notifications;if(state.prefs.notifications&&"Notification"in window)Notification.requestPermission().catch(()=>{})}
 if(key==="brownNoise"){state.pom.brownNoise=!state.pom.brownNoise;syncBrownNoise()}
 persist();render();syncBrownNoise()
}
function openFocusSelect(){
 const ts=tasksFor(selectedDate);document.getElementById("modal").innerHTML=`<div class="modal"><h2>Focus on task</h2><label>Today's task</label><select id="focusTask" class="field"><option value="">No selected task</option>${ts.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("")}</select><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn black" data-save-focus>Save</button></div></div>`;document.getElementById("modal").classList.add("show");document.getElementById("focusTask").value=state.pom.selectedTask||"";document.querySelector("[data-save-focus]").onclick=()=>{state.pom.selectedTask=document.getElementById("focusTask").value;persist();closeModal();render()}
}
function dataAction(type){
 if(type==="export"){
  const payload={version:2,exportedAt:new Date().toISOString(),templates:state.templates,completions:state.completions,custom:state.custom,pom:state.pom,stats:state.stats,prefs:state.prefs,exams:state.exams};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daily-system-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Data exported.")
 }else if(type==="import")document.getElementById("importFile").click();
 else if(type==="reset"){if(confirm("Reset all Daily System data? This cannot be undone.")){skipUnloadSave=true;clearInterval(startPom.iv);clearInterval(studyInterval);localStorage.clear();location.reload()}}
}
document.getElementById("importFile").onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const x=JSON.parse(await file.text());if(!x.templates||!x.completions||!x.pom||!x.stats||!x.prefs)throw Error();
  if(confirm("Replace existing data with this backup?")){state.templates=x.templates;state.completions=x.completions;state.custom=x.custom||{};state.pom=x.pom;state.stats=x.stats;state.prefs=x.prefs;state.exams=Array.isArray(x.exams)?x.exams:[];ensurePlanGroups();upgradeWorkweekPlan();upgradeWeekendPlan();ensureStudyCategories();ensureStudyFlow();tableGroup=PLAN_GROUPS.some(g=>g.id===state.prefs.tableGroup)?state.prefs.tableGroup:"Weekdays";persist();render();toast("Data imported successfully.")}}
 catch{toast("Invalid Daily System backup file.")}e.target.value=""
};
document.getElementById("prevBtn").onclick=()=>navigate(-1);
document.getElementById("nextBtn").onclick=()=>navigate(1);
document.getElementById("todayBtn").onclick=goToday;
document.getElementById("quickExam").onclick=()=>setPage("exams");
document.getElementById("quickPom").onclick=()=>setPage("pomodoro");
document.getElementById("menuBtn").onclick=()=>{menuOpen=!menuOpen;document.querySelector(".sidebar").style.display=menuOpen?"flex":"none";document.querySelector(".sidebar").style.position="fixed"};
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.matches("[data-close]"))closeModal()});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&document.getElementById("modal").classList.contains("show")){closeModal();return}
 if(document.getElementById("modal").classList.contains("show"))return;
 if(e.target.matches("input,textarea,select"))return;
 if(e.key.toLowerCase()==="n")navigate(1);
 if(e.key.toLowerCase()==="p")navigate(-1);
 if(e.key.toLowerCase()==="t")goToday();
 if(e.code==="Space"){e.preventDefault();focusTimer?.running?pausePom():startPom()}
 if(e.key.toLowerCase()==="r")resetPom();
});
window.addEventListener("beforeunload",()=>{if(!skipUnloadSave){persist();saveActiveTimers()}});
function syncTimersAfterReturn(){
 if(focusTimer?.running){syncPom();updateTimerDOM()}
 if(studyTimer?.running)tickStudy();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncTimersAfterReturn()});
function refreshCalendarDay(){
 const today=dateKey(new Date());if(today===renderedDay)return;
 if(dateKey(selectedDate)===renderedDay)selectedDate=fromKey(today);
 renderedDay=today;render();
}
setInterval(refreshCalendarDay,60000);
window.addEventListener("focus",()=>{refreshCalendarDay();syncTimersAfterReturn()});
init();
</script>
</body>
</html>
